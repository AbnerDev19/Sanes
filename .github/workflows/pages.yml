name: Build and deploy Pages
on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run catalog:audit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
      - run: npm run check:production -- --config-only
      - run: npm run build
      - name: Check committed build when legacy Pages is in use
        if: vars.PAGES_ACTIONS_ENABLED != 'true'
        run: |
          npm run build:pages
          changes=$(git status --porcelain --untracked-files=all -- index.html assets/ favicon.svg robots.txt sitemap.xml 404.html produto/ .nojekyll)
          if [ -n "$changes" ]; then
            echo '::error::Os arquivos do Pages legado precisam ser atualizados. Rode npm ci e npm run build:pages e inclua os arquivos gerados no commit.'
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: test-results
      - name: Prepare production artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ACTIONS_ENABLED == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_CAPTCHA_SITE_KEY: ${{ vars.VITE_CAPTCHA_SITE_KEY }}
          VITE_BUSINESS_ADDRESS: ${{ vars.VITE_BUSINESS_ADDRESS }}
          VITE_BUSINESS_CNPJ: ${{ vars.VITE_BUSINESS_CNPJ }}
          VITE_BUSINESS_HOURS: ${{ vars.VITE_BUSINESS_HOURS }}
          VITE_BUSINESS_EMAIL: ${{ vars.VITE_BUSINESS_EMAIL }}
          VITE_DEVELOPMENT_CREDITS: ${{ vars.VITE_DEVELOPMENT_CREDITS }}
          CATALOG_PENDING_ACCEPTED: ${{ vars.CATALOG_PENDING_ACCEPTED }}
        run: |
          npm run check:production -- --config-only --require-backend
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ACTIONS_ENABLED == 'true'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ACTIONS_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fresh build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
